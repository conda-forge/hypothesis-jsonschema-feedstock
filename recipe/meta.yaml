{% set version = "0.23.2" %}

package:
  name: hypothesis-jsonschema
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/hypothesis-jsonschema/hypothesis_jsonschema-{{ version }}.tar.gz
  sha256: 43a5f21c67f7cdccd6e3e0d1300cb5261bede6c046e3eff8a73c094b4afdf761

build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - hypothesis >=6.84.3
    - jsonschema >=4.18.0
    - python >={{ python_min }}

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - hypothesis_jsonschema
  commands:
    - pip check

about:
  home: https://pypi.org/project/hypothesis-jsonschema/
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: Tools to generate test data from JSON schemata with Hypothesis
  dev_url: https://github.com/python-jsonschema/hypothesis-jsonschema

extra:
  recipe-maintainers:
    - bollwyvl
