# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.23.2"

package:
  name: hypothesis-jsonschema
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/h/hypothesis-jsonschema/hypothesis_jsonschema-${{ version }}.tar.gz
  sha256: 43a5f21c67f7cdccd6e3e0d1300cb5261bede6c046e3eff8a73c094b4afdf761

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - hypothesis>=6.170.10
    - jsonschema >=4.18.0
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - hypothesis_jsonschema/**
        - hypothesis_jsonschema-${{ version }}.dist-info/**
  - python:
      imports: hypothesis_jsonschema
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  license: MPL-2.0
  license_file: LICENSE
  summary: Tools to generate test data from JSON schemata with Hypothesis
  homepage: https://pypi.org/project/hypothesis-jsonschema
  repository: https://github.com/python-jsonschema/hypothesis-jsonschema

extra:
  recipe-maintainers:
    - bollwyvl
